<?xml version="1.0"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <title>ATR 共读伴随窗</title>
  <style>
    :root {
      color-scheme: light dark;
      font: menu;
      background: Canvas;
      color: CanvasText;
    }
    html, body, #atr-companion-root { margin: 0; min-height: 100%; }
    body { overflow: auto; }
    .atr-companion-toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 6px 10px;
      border-bottom: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      background: color-mix(in srgb, Canvas 94%, transparent);
      backdrop-filter: blur(10px);
    }
    .atr-companion-content { padding: 10px; }
    button { color: inherit; }
    details > summary { user-select: none; }
  </style>
</head>
<body>
  <div id="atr-companion-root" role="region" aria-label="ATR 共读伴随上下文"></div>
</body>
</html>
