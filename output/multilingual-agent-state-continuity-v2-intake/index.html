function renderKnowledge(){let wrap=document.createElement('div'),domain=by['concept:domain'],maps=data.nodes.filter(n=>n.kind==='concept_map'),knowledge=data.nodes.filter(n=>n.kind==='knowledge_concept');wrap.append(Object.assign(document.createElement('h2'),{textContent:domain?.label||'知识体系'}));if(!maps.length)wrap.innerHTML+='<p class="empty">尚无带来源定义的知识概念图；不会用 frontier 维度冒充完整层级。</p>';for(const map of maps){let box=document.createElement('div');box.className='card';box.innerHTML='<strong>'+esc(map.label)+'</strong><p class="legend">仅显示已落盘、带来源与边界的概念。父子关系是阅读导航，不是因果证明。</p>';let roots=data.edges.filter(e=>e.source===map.id&&e.relation==='roots_concept').map(e=>by[e.target]).filter(Boolean),add=(node,level)=>{let d=node.data||{},row=document.createElement('div');row.style.marginLeft=(level*22)+'px';row.style.padding='7px 0';row.innerHTML='<strong>'+esc(node.label)+'</strong><p>'+esc(d.definition||'未记录定义')+'</p><p class="legend">来源：'+esc((d.source_ids||[]).join('；')||'未记录')+'；不能说明：'+esc(d.does_not_establish||'未记录')+'</p>';row.onclick=()=>show(node);box.append(row);for(const child of data.edges.filter(e=>e.source===node.id&&e.relation==='specializes_concept').map(e=>by[e.target]).filter(Boolean))add(child,level+1)};roots.forEach(root=>add(root,0));wrap.append(box)}for(const q of data.nodes.filter(n=>n.kind==='research_question')){let box=document.createElement('div');box.className='card';let concepts=data.edges.filter(e=>e.source===q.id&&e.relation==='requires_concept').map(e=>by[e.target]).filter(Boolean),papers=data.edges.filter(e=>e.source===q.id&&e.relation==='anchored_by').map(e=>by[e.target]).filter(Boolean);box.innerHTML='<strong>'+esc(q.label)+'</strong><p class="legend">从前沿问题展开到需要理解的概念与锚定来源。</p><h3>所需概念</h3>'+concepts.map(n=>'<span class="tag">'+esc(n.label)+'</span>').join('')+'<h3>锚定来源</h3>';for(const p of papers)box.append(button(p));box.onclick=e=>{if(e.target===box||e.target.tagName==='STRONG')show(q)};wrap.append(box)}if(!data.nodes.some(n=>n.kind==='research_question'))wrap.innerHTML+='<p class="empty">该 run 尚未产生 frontier tensions，不能自动编造知识层级。</p>';$('#view').replaceChildren(wrap)}
function renderClaims(){let wrap=document.createElement('div'),claims=data.nodes.filter(n=>n.kind==='claim');wrap.innerHTML='<p class="legend">断言由 ATR artifact 提出，不是论文本身的原话。只有明确记录 source ID 的断言才显示来源连线；请在 Zotero 中阅读原始材料后再作出判断。</p>';for(const claim of claims){let box=document.createElement('div');box.className='card';let d=claim.data||{},sources=data.edges.filter(e=>e.source===claim.id&&e.relation==='cites_explicit_source').map(e=>by[e.target]).filter(Boolean),prior=data.edges.filter(e=>e.source===claim.id&&e.relation==='supersedes').map(e=>by[e.target]).filter(Boolean);box.innerHTML='<strong>'+esc(claim.label)+'</strong><p><span class="tag">'+esc(d.status||'UNSPECIFIED')+'</span><span class="tag">claim '+esc(d.claim_id||'')+'</span></p><h3>适用条件</h3><p>'+esc(JSON.stringify(d.conditions||{}))+'</p><h3>不能声称</h3><p>'+esc((d.forbidden_claims||[]).join('；')||'未记录')+'</p><h3>显式来源</h3><p>'+esc(sources.map(n=>n.label).join('；')||'该 artifact 未声明来源 ID')+'</p>';if(prior.length)box.innerHTML+='<h3>替代的旧断言</h3><p>'+esc(prior.map(n=>n.label).join('；'))+'</p>';box.onclick=()=>show(claim);wrap.append(box)}if(!claims.length)wrap.innerHTML+='<p class="empty">该 run 没有可用的 claim ledger；工作台不会从论文标题或摘要自动编造断言。</p>';$('#view').replaceChildren(wrap)}
function renderEvolution(){let wrap=document.createElement('div'),contexts=data.nodes.filter(n=>n.kind==='knowledge_context'),steps=data.nodes.filter(n=>n.kind==='knowledge_step'),briefs=data.nodes.filter(n=>n.kind==='landscape_brief'),tensions=data.nodes.filter(n=>n.kind==='real_world_tension'),problems=data.nodes.filter(n=>n.kind==='research_problem'),timeline=Array.isArray(data.timeline)?data.timeline:[];wrap.innerHTML='<h2>知识与现实问题如何进入研究</h2><p class="legend">这里仅展示 ATR 明确记录的 artifact。缺失并不由工作台替你补写。</p><h3>研究演化时间线</h3>';if(!timeline.length)wrap.innerHTML+='<p class="empty">当前 run 未提供可排序的时间戳 artifact。</p>';for(const item of timeline){let box=document.createElement('div');box.className='card';box.innerHTML='<strong>'+esc(item.at||'未记录时间')+' · '+esc(item.kind||'artifact')+'</strong><p>'+esc(item.label||item.id||'未命名 artifact')+'</p>';wrap.append(box)}wrap.innerHTML+='<h3>已读证据的景观简报</h3>';if(!briefs.length)wrap.innerHTML+='<p class="empty">尚无 landscape brief；不能把来源列表伪装成已完成的证据综合。</p>';for(const brief of briefs){let d=brief.data||{},sources=data.edges.filter(e=>e.source===brief.id&&e.relation==='inspects_explicit_source').map(e=>by[e.target]).filter(Boolean),box=document.createElement('div');box.className='card';box.innerHTML='<strong>'+esc(brief.label)+'</strong><p><span class="tag">'+esc(d.disposition||'UNSPECIFIED')+'</span><span class="tag">'+(d.immutable?'immutable':'draft')+'</span></p><p>'+esc(d.observed_tension||'未记录张力')+'</p><h3>还不能证明</h3><p>'+esc((d.sources_do_not_establish||[]).join('；')||'未记录')+'</p><h3>最小下一判别</h3><p>'+esc(d.smallest_next_discriminator||'未记录')+'</p><h3>已检查来源</h3><p>'+esc(sources.map(n=>n.label).join('；')||'未记录')+'</p>';box.onclick=()=>show(brief);wrap.append(box)}wrap.innerHTML+='<h3>从前沿张力到断言的知识收缩</h3>';if(!contexts.length)wrap.innerHTML+='<p class="empty">尚无 knowledge-context artifact。</p>';for(const context of contexts){let box=document.createElement('div');box.className='card';let queue=data.edges.filter(e=>e.source===context.id&&e.relation==='contracts_to').map(e=>by[e.target]).filter(Boolean),lines=[];while(queue.length){let step=queue.shift();lines.push((step.data.layer||'步骤')+'：'+step.label);queue.push(...data.edges.filter(e=>e.source===step.id&&e.relation==='contracts_to').map(e=>by[e.target]).filter(Boolean))}box.innerHTML='<strong>'+esc(context.label)+'</strong><p>'+esc(lines.join(' → ')||'没有收缩步骤')+'</p>';box.onclick=()=>show(context);wrap.append(box)}if(!contexts.length&&steps.length)wrap.innerHTML+='<p class="warning">发现未归属的知识步骤，需回到 ATR artifact 修复 lineage。</p>';wrap.innerHTML+='<h3>现实世界张力</h3>';if(!tensions.length)wrap.innerHTML+='<p class="empty">尚无 opportunity-map artifact。</p>';for(const tension of tensions){let d=tension.data||{},box=document.createElement('div');box.className='card';box.innerHTML='<strong>'+esc(tension.label)+'</strong><p>主体：'+esc(d.actor||'未记录')+'；后果：'+esc(d.material_consequence||'未记录')+'</p><p class="legend">不能说明：'+esc(d.does_not_establish||'未记录')+'</p>';box.onclick=()=>show(tension);wrap.append(box)}wrap.innerHTML+='<h3>可证伪的研究问题</h3>';if(!problems.length)wrap.innerHTML+='<p class="empty">尚无 research-problem-card artifact。</p>';for(const problem of problems){let d=problem.data||{},roles=data.edges.filter(e=>e.target===problem.id&&e.relation==='has_explicit_problem_role'),box=document.createElement('div');box.className='card';box.innerHTML='<strong>'+esc(problem.label)+'</strong><p>'+esc((d.counterfactual_worlds||[]).map(w=>(w.label||'世界')+'：'+(w.explanation||'未记录')).join('；'))+'</p><p class="legend">最小证伪条件：'+esc(d.minimum_falsifier||'未记录')+'</p><h3>论文在此问题中的位置</h3>';for(const role of roles){let paper=by[role.source],r=role.data||{};box.innerHTML+='<p><strong>'+esc(paper?.label||role.source)+'</strong>（'+esc(r.posture||'OBSERVED')+'）：解决 '+esc(r.resolves||'未记录')+'；仍未解决 '+esc(r.leaves_unresolved||'未记录')+'</p>'}box.onclick=()=>show(problem);wrap.append(box)}$('#view').replaceChildren(wrap)}
const renderLegacyEvolution=renderEvolution;
function renderEvolution(){if(data.projection!=='derived-read-only-v2-sqlite')return renderLegacyEvolution();let wrap=document.createElement('div'),problems=data.nodes.filter(n=>n.kind==='research_problem'),reviews=data.nodes.filter(n=>n.kind==='collision_review'),attachments=data.nodes.filter(n=>n.kind==='atr_v2_attachment');wrap.innerHTML='<h2>ATR v2：知识与现实问题链路</h2><p class="legend">SQLite 是权威；以下节点只来自已注册的 immutable artifact。附件不会自动改变 lifecycle。</p><h3>事务时间线</h3>';for(const item of data.timeline||[]){let box=document.createElement('div');box.className='card';box.innerHTML='<strong>'+esc(item.at)+' · '+esc(item.kind)+'</strong><p>'+esc(item.label)+'</p>';wrap.append(box)}wrap.innerHTML+='<h3>问题案例</h3>';for(const p of problems){let d=p.data||{},box=document.createElement('div');box.className='card';box.innerHTML='<strong>'+esc(p.label)+'</strong><p>两种世界：'+esc((d.worlds||[]).map(w=>typeof w==='string'?w:(w.label||'世界')).join('；')||'未记录')+'</p><p>判别器：'+esc(d.discriminator||'未记录')+'</p><p class="legend">证伪条件：'+esc(d.falsifier||'未记录')+'</p>';box.onclick=()=>show(p);wrap.append(box)}if(!problems.length)wrap.innerHTML+='<p class="empty">尚无已注册 problem-case artifact。</p>';wrap.innerHTML+='<h3>碰撞复核与残存边界</h3>';for(const r of reviews){let d=r.data||{},box=document.createElement('div');box.className='card';box.innerHTML='<strong>'+esc(r.label)+'</strong><p><span class="tag">'+esc(d.disposition||'UNSPECIFIED')+'</span><span class="tag">不是 gate</span></p><p>'+esc(d.surviving_boundary||'没有记录残存边界')+'</p><p class="legend">下一证据：'+esc((d.next_evidence||[]).join('；')||'未记录')+'</p>';box.onclick=()=>show(r);wrap.append(box)}if(!reviews.length)wrap.innerHTML+='<p class="empty">尚无 claim-scoped collision review。</p>';wrap.innerHTML+='<h3>人类/证据附件</h3>';for(const a of attachments){let box=document.createElement('div');box.className='card';box.innerHTML='<strong>'+esc(a.label)+'</strong><p>'+esc(a.data.note||'')+'</p><p class="legend">绑定到 subject version '+esc(a.data.subject_version)+'；不推进 lifecycle。</p>';box.onclick=()=>show(a);wrap.append(box)}$('#view').replaceChildren(wrap)}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));({questions:renderQuestions,knowledge:renderKnowledge,evolution:renderEvolution,claims:renderClaims,papers:renderPapers}[b.dataset.view])()});renderMetrics();renderQuestions();
